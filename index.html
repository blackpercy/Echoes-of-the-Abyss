<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Echoes of the Abyss</title>
  <meta name="description" content="An idle game of forbidden lore, black seas and the thing that dreams beneath them.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#0b0d10">
</head>
<body>
  <header id="top">
    <button class="menu-btn" data-act="toggle-nav" aria-label="Menu">☰</button>
    <div class="brand">Echoes of the Abyss</div>
    <div class="meters">
      <div class="bar hp"><div class="fill" id="h-hp"></div><span class="bar-label" id="h-hp-label"></span></div>
      <div class="bar sanity"><div class="fill" id="h-sanity"></div><span class="bar-label" id="h-sanity-label"></span></div>
    </div>
    <div class="gold">💰 <span id="h-gold">0</span></div>
    <div class="clock" id="h-clock"></div>
    <button class="icon-btn" data-act="audio" id="h-audio" title="Ambient sound">🔇</button>
    <div class="activity" id="h-activity"></div>
  </header>
  <nav id="nav"></nav>
  <main id="page"></main>
  <aside id="log" aria-live="polite"></aside>
  <div id="modal"></div>
  <div id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/story.js"></script>
  <script src="js/content.js"></script>
  <script src="js/game.js"></script>
  <script src="js/mind.js"></script>
  <script src="js/systems.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
